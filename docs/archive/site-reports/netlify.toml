[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "echo 'No build step required for static site'"

# Redirect API routes to Netlify Functions
[[redirects]]
  from = "/api/rooms"
  to = "/.netlify/functions/rooms"
  status = 200

[[redirects]]
  from = "/api/bookings"
  to = "/.netlify/functions/bookings"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/reviews"
  to = "/.netlify/functions/reviews"
  status = 200

[[redirects]]
  from = "/api/availability"
  to = "/.netlify/functions/availability"
  status = 200

# Redirect pages without .html extension to their .html version
[[redirects]]
  from = "/presentation"
  to = "/presentation.html"
  status = 301

[[redirects]]
  from = "/chambres"
  to = "/chambres.html"
  status = 301

[[redirects]]
  from = "/reservation"
  to = "/reservation.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 301

[[redirects]]
  from = "/register"
  to = "/register.html"
  status = 301

# Redirect clean URLs to .html versions
[[redirects]]
  from = "/galerie"
  to = "/galerie.html"
  status = 301

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/offres"
  to = "/offres.html"
  status = 301

[[redirects]]
  from = "/conferences"
  to = "/conferences.html"
  status = 301

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 301

[[redirects]]
  from = "/confirmation"
  to = "/confirmation.html"
  status = 301

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables (to be set in Netlify UI)
# SUPABASE_URL
# SUPABASE_ANON_KEY
# DEFAULT_EXCHANGE_RATE
# SMTP_HOST (for emails)
# SMTP_USER
# SMTP_PASS

[dev]
  command = "echo 'Starting dev server...'"
  port = 8888
  targetPort = 8888
  framework = "#static"
  autoLaunch = true
