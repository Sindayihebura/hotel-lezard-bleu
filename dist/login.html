<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | Le Lézard Bleu Bujumbura</title>
  <meta name="description" content="Connectez-vous à votre compte Hôtel Le Lézard Bleu pour gérer vos réservations.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/env-config.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="header-navbar">
    <div class="container nav-container">
      <a href="/index.html" class="nav-logo">
        <div class="nav-logo-icon">L</div>
        <div class="nav-logo-text">
          <span class="nav-brand-title">LE LÉZARD BLEU</span>
          <span class="nav-brand-subtitle">Bujumbura • Burundi ★★★★★</span>
        </div>
      </a>
      <div style="display: flex; align-items: center; gap: 0.85rem;">
        <a href="/index.html" class="btn btn-outline-gold" style="padding: 0.65rem 1.25rem;">← Retour</a>
      </div>
    </div>
  </header>

  <!-- Login Form -->
  <div style="padding-top: 120px; min-height: 100vh; background: var(--bg-dark-deep); display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 480px;">
      
      <div style="text-align: center; margin-bottom: 3rem;">
        <div class="nav-logo-icon" style="margin: 0 auto 1.5rem auto;">L</div>
        <h1 style="font-family: var(--font-heading); color: var(--text-light-primary); margin-bottom: 0.5rem; font-size: 2rem;">
          Connexion
        </h1>
        <p style="color: var(--text-muted);">
          Accédez à votre compte pour gérer vos réservations
        </p>
      </div>

      <!-- Login Form -->
      <div style="background: var(--bg-dark-card); border: 1px solid var(--border-gold); border-radius: var(--radius-md); padding: 2.5rem;">
        
        <!-- Google OAuth Button -->
        <button type="button" id="googleSignInBtn" class="btn btn-gold" style="width: 100%; padding: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.75rem; margin-bottom: 1.5rem;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continuer avec Google
        </button>

        <div style="text-align: center; margin: 1.5rem 0; color: var(--text-muted); font-size: 0.9rem; position: relative;">
          <span style="background: var(--bg-dark-card); padding: 0 1rem; position: relative; z-index: 1;">OU</span>
          <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border-subtle); z-index: 0;"></div>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email" class="form-label">Adresse Email</label>
            <input type="email" id="email" name="email" class="form-input" required placeholder="votre@email.com">
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••">
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-muted); font-size: 0.9rem;">
              <input type="checkbox" name="remember" style="width: 16px; height: 16px;">
              Se souvenir de moi
            </label>
            <a href="/reset-password.html" style="color: var(--accent-gold-primary); font-size: 0.9rem;">
              Mot de passe oublié ?
            </a>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-gold" style="width: 100%; padding: 1rem; margin-bottom: 1rem;">
            Se Connecter
          </button>

          <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">
            Pas encore de compte ?
            <a href="/register.html" style="color: var(--accent-gold-primary); font-weight: 600;">
              Créer un compte
            </a>
          </p>
        </form>

      </div>

    </div>
  </div>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/app.js"></script>
  <script type="module" src="/assets/js/supabase-auth.js"></script>
  
  <script type="module">
    // supabase-auth.js est un module ES qui s'exécute avant ce script (ordre garanti)
    // On attend la promesse d'initialisation exposée par le module
    await window.__supabaseAuthReady;

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const googleBtn = document.getElementById('googleSignInBtn');

    // Vérifier si un message de succès d'inscription existe
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'true') {
      window.AuthUI.showMessage('Inscription réussie ! Connectez-vous avec vos identifiants.', 'success');
    }

    // Connexion email + mot de passe
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Validation
      if (!window.AuthValidator.validateEmail(email)) {
        window.AuthUI.showError({ message: 'Adresse email invalide.' });
        return;
      }

      if (!password) {
        window.AuthUI.showError({ message: 'Veuillez saisir votre mot de passe.' });
        return;
      }

      window.AuthUI.showLoading(submitBtn, 'Connexion...');

      try {
        const result = await window.SupabaseAuth.signInWithEmail({
          email,
          password
        });

        window.AuthUI.showMessage('Connexion réussie !', 'success');

        // Redirection
        const redirect = urlParams.get('redirect');
        setTimeout(() => {
          window.location.href = redirect || '/account.html';
        }, 1000);

      } catch (error) {
        window.AuthUI.showError(error);
      } finally {
        window.AuthUI.hideLoading(submitBtn);
      }
    });

    // Connexion Google
    googleBtn.addEventListener('click', async () => {
      window.AuthUI.showLoading(googleBtn, 'Redirection vers Google...');

      try {
        await window.SupabaseAuth.signInWithGoogle();
        // La redirection vers Google se fait automatiquement
      } catch (error) {
        window.AuthUI.showError(error);
        window.AuthUI.hideLoading(googleBtn);
      }
    });
  </script>

</body>
</html>
