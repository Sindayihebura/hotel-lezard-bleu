name: Déploiement GitHub Pages

on:
  push:
    branches:
      - arena/d9de0dac-hotel-lezard-bleu
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Préparation du site statique
        run: node tools/build-pages.js

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Téléversement de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
